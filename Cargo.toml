[package]
name = "runin"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Minimal CLI utility for selecting a project directory with zoxide/fzf or fd/fzf and running a command within it."
repository = "https://github.com/MiguelRegueiro/runin"
homepage = "https://github.com/MiguelRegueiro/runin"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
shell-words = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
